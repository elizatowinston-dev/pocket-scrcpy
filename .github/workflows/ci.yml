name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify pinned scrcpy-server.jar checksum
        run: |
          echo "764eb6f79811d5211fe9df341120882ba9994c7a61b897d7bf3fb662e53bc536  app/src/main/assets/scrcpy-server.jar" | sha256sum -c -

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run protocol and adb unit tests
        run: ./gradlew :protocol:test :adb:test --no-daemon

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug and DebugSigned APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugSigned --no-daemon

      - name: Report APK sizes and SHA-256 checksums
        run: |
          ls -lh /tmp/build/app/outputs/apk/debug/*.apk /tmp/build/app/outputs/apk/debugSigned/*.apk
          sha256sum /tmp/build/app/outputs/apk/debug/*.apk /tmp/build/app/outputs/apk/debugSigned/*.apk

      - name: Upload app-debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/build/app/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload app-debugSigned APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debugSigned-apk
          path: /tmp/build/app/outputs/apk/debugSigned/*.apk
          if-no-files-found: error
